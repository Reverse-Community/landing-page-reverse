services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://reverse:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/reverse
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/public/uploads
    networks:
      - reverse

  migrate:
    build:
      context: .
      target: builder
    profiles:
      - tools
    env_file: .env
    environment:
      DATABASE_URL: postgres://reverse:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/reverse
    command: npm run db:push
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - reverse

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: reverse
      POSTGRES_USER: reverse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reverse -d reverse"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - reverse

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - reverse

networks:
  reverse:

volumes:
  pg_data:
  uploads:
  caddy_data:
  caddy_config:
