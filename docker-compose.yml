services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: file:./data/reverse-community.db
    volumes:
      - sqlite_data:/app/data
      - uploads:/app/public/uploads
    networks:
      - reverse

  migrate:
    build:
      context: .
      target: builder
    profiles:
      - tools
    env_file: .env
    environment:
      DATABASE_URL: file:./data/reverse-community.db
    command: ["npm", "run", "migrate"]
    volumes:
      - sqlite_data:/app/data
    networks:
      - reverse

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - reverse

networks:
  reverse:

volumes:
  sqlite_data:
  uploads:
  caddy_data:
  caddy_config:
