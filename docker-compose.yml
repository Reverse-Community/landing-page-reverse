services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://reverse:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/reverse
    depends_on:
      - postgres
    networks:
      - reverse

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: reverse
      POSTGRES_USER: reverse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - reverse

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - reverse

networks:
  reverse:

volumes:
  pg_data:
  caddy_data:
  caddy_config:
